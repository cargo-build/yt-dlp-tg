# Template for /etc/conf.d/yt-dlp-tg. Choose an allowlist or explicit public access.
export ALLOWED_USER_IDS="${ALLOWED_USER_IDS:?Set comma-separated Telegram user IDs or * for public access}"
export BOT_TOKEN_FILE="/etc/yt-dlp-tg/bot-token"
export MODE="polling"
export YTDLP_PATH="/opt/yt-dlp-tg/tools/bin/yt-dlp"
export YTDLP_COOKIES="/var/lib/yt-dlp-tg/youtube-cookies.txt"
export DOWNLOAD_DIR="/var/cache/yt-dlp-tg/downloads"
export CACHE_PATH="/var/lib/yt-dlp-tg/files.redb"
export OCR_PYTHON="/opt/yt-dlp-tg/ocr-tools/bin/python"
export OCR_SCRIPT="/opt/yt-dlp-tg/current/scripts/vision.py"
export OCR_CONFIG="/opt/yt-dlp-tg/current/config/track-vision/policy.json"
export OCR_SECRETS_FILE="/etc/yt-dlp-tg/vision-secrets.json"
export HOME="/var/lib/yt-dlp-tg"
export XDG_CACHE_HOME="/var/cache/yt-dlp-tg"
export IGGY_CONNECTION_STRING_FILE="/etc/yt-dlp-tg/iggy-connection"
export IGGY_STREAM="yt_dlp_tg"
export IGGY_TOPIC="downloads"
export IGGY_MAX_PENDING="256"
export PATH="/opt/yt-dlp-tg/tools/bin:${PATH}"
